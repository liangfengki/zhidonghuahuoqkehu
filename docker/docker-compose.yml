version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: b2b_lead_gen
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data

  # Optional: rapid-email-verifier self-hosted
  email-verifier:
    image: ghcr.io/vanutp/rapid-email-verifier:latest
    ports:
      - "8000:8000"
    profiles:
      - full

  # MinIO for S3-compatible storage (dev)
  minio:
    image: minio/minio:latest
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    profiles:
      - full

volumes:
  pgdata:
  redisdata:
  miniodata:
